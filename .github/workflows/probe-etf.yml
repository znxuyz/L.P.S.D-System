name: Probe data sources (temporary)
on:
  push:
    branches: [claude/charming-pasteur-mt3jzo]
    paths: ['.github/workflows/probe-etf.yml', 'scripts/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_START: '2025-01-01'
      HOURLY: 'true'
      CANDLE_MAX_DATES: '3'
      INST_MAX: '3'
      RATIO_MAX: '3'
      EVENT_MAX: '2'
      TDCC_MAX: '5'
      FIN_MAX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git clone --depth 1 --branch data https://github.com/${{ github.repository }}.git .data
      - run: node scripts/candles.ts .data | tail -4
      - run: node scripts/history.ts .data
      - run: node scripts/chips.ts .data
      - run: node scripts/financials.ts .data | tail -8
      - run: |
          ls .data/ratios .data/events | head -30; ls .data/tdcc .data/fin
          head -c 400 .data/ratios/*.json | head -c 900; echo
          cat .data/events-backfill.json; echo; ls .data/inst | head -3; ls .data/inst | wc -l
          node -e "const m=require('./.data/candles-meta.json');console.log(m.twse.length,m.twse[0])"
