name: Probe data sources (temporary)
on:
  push:
    branches: [claude/charming-pasteur-mt3jzo]
    paths: ['.github/workflows/probe-etf.yml', 'scripts/chips.ts']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/chips.ts /tmp/d
      - run: |
          node -e "const c=require('/tmp/d/chips.json');console.log(c.inst?.asOf,c.inst?.days,Object.keys(c.inst?.streak??{}).length,'2330',c.inst?.streak['2330'],'8299',c.inst?.streak['8299']);console.log(JSON.stringify(c.big))"
          ls /tmp/d/inst /tmp/d/tdcc; du -sh /tmp/d/chips.json
