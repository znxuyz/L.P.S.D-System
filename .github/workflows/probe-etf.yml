name: Probe data sources (temporary)
on:
  push:
    branches: [claude/charming-pasteur-mt3jzo]
    paths: ['.github/workflows/probe-etf.yml', 'scripts/financials.ts', 'web/src/data/mopsParse.ts']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: time node scripts/financials.ts /tmp/d
        timeout-minutes: 25
      - run: |
          node -e "const f=require('/tmp/d/fundamentals.json');console.log(f.quarter,f.dividends,Object.keys(f.stocks).length);for(const c of ['2330','8299','2881','1101','2412','3441'])console.log(c,JSON.stringify(f.stocks[c]));const ev=Object.entries(f.stocks).filter(([,v])=>v.events);console.log('events',ev.length,JSON.stringify(ev.slice(0,5)))"
          ls -la /tmp/d/fin /tmp/d/div /tmp/d/events; cat /tmp/d/events/*.json | head -c 1500
