name: Probe data sources (temporary)
on:
  push:
    branches: [claude/charming-pasteur-mt3jzo]
    paths: ['.github/workflows/probe-etf.yml', 'scripts/history.ts', 'scripts/chips.ts']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/chips.ts /tmp/d > /dev/null
      - run: PE_MONTHS=14 EVENT_MAX=3 TDCC_MAX=5 node scripts/history.ts /tmp/d
        timeout-minutes: 20
      - run: node scripts/chips.ts /tmp/d | tail -1
      - run: |
          node -e "const p=require('/tmp/d/pe5y.json');console.log(p.from,p.to,p.months,Object.keys(p.stocks).length,JSON.stringify(p.stocks['2330']),JSON.stringify(p.stocks['8299']));const c=require('/tmp/d/chips.json');console.log(JSON.stringify(c.big).slice(0,300))"
          ls /tmp/d/pe /tmp/d/events; cat /tmp/d/events/*.json | head -c 1500
