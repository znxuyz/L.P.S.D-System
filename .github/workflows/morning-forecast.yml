name: Morning forecast

# 開盤前預測：美股收盤（台北約 04:00～05:00）後、台股開盤前，抓前一晚的美股，
# 用包含美股的資料把「今天」的預測存進 forecasts 分支（事前存檔，只新增不覆蓋），再更新網站。
# - 平日台北 05:17～08:31 約每 30 分鐘一次（排程可能延遲或跳過；存檔程式只在 05:00～08:45 存）
# - 抓美股的程式有改動時：馬上跑一次（驗證抓得到）
on:
  schedule:
    # GitHub 的排程常常延遲很久、甚至跳過（11/20 07:13 沒跑；11/23 的 05:47、07:13 延遲到 09:59、11:42 才跑，超過 08:45 存不了），
    # 所以從台北 05:17 起每 30 分鐘左右排一次，到 08:31 為止；存檔不覆蓋，先成功的那份算數，之後的會直接略過
    - cron: '17 21 * * 0-4'
    - cron: '47 21 * * 0-4'
    - cron: '19 22 * * 0-4'
    - cron: '43 22 * * 0-4'
    - cron: '13 23 * * 0-4'
    - cron: '37 23 * * 0-4'
    - cron: '9 0 * * 1-5'
    - cron: '31 0 * * 1-5'
  push:
    branches: [main]
    paths: ['scripts/us-market.ts', '.github/workflows/morning-forecast.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 自己一組：跟每小時的資料更新共用的話，排隊中的工作會被後來的取代（開盤前預測就跑不到）。
# 寫回 data 分支時重新取出最新版、只放進 us/，盡量不蓋掉資料更新剛寫入的東西。
concurrency:
  group: morning-forecast
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 取出 data 與 forecasts 分支
        run: |
          git clone -q --depth 1 --branch data "$DATA_REMOTE" .data
          if git ls-remote --exit-code --heads "$DATA_REMOTE" forecasts >/dev/null; then
            git clone -q --branch forecasts "$DATA_REMOTE" .forecasts
          else
            git init -q -b forecasts .forecasts && git -C .forecasts remote add origin "$DATA_REMOTE"
          fi

      - name: 抓美股與臺指期夜盤
        run: |
          node scripts/us-market.ts .data
          node scripts/taifex-daily.ts .data || true

      - name: 存回 data 分支（只更新美股與夜盤）
        run: |
          for t in 1 2 3; do
            rm -rf .data-latest
            git clone -q --depth 1 --branch data "$DATA_REMOTE" .data-latest
            rm -rf .data-latest/us && cp -r .data/us .data-latest/us
            if [ -d .data/txdaily ]; then rm -rf .data-latest/txdaily && cp -r .data/txdaily .data-latest/txdaily; fi
            cd .data-latest
            base=$(git rev-parse HEAD)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q --orphan snapshot
            git add -A
            git commit -q -m "Market data $(date -u +'%F %H:%M')（美股）"
            # 只在 data 分支還是剛剛取出的版本時才推（被別人更新了就重來一次）
            if git push -q --force-with-lease=data:$base origin snapshot:data; then cd ..; break; fi
            cd ..
            sleep 20
          done

      - name: 開盤前預測存檔
        run: |
          ARCHIVE_DIR=.forecasts ARCHIVE_KIND_SUFFIX=-pre ARCHIVE_ONLY=1 node scripts/predict.ts .data || true
          ARCHIVE_DIR=.forecasts ARCHIVE_KIND_SUFFIX=-pre ARCHIVE_ONLY=1 node scripts/predict-intraday.ts .data || true
          cd .forecasts
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Forecasts (morning) $(date -u +'%F %H:%M')"
            git push -q origin HEAD:forecasts
            echo "已推送開盤前存檔"
          fi

      # 由等待工作（workflow_dispatch＋GITHUB_TOKEN）啟動時，GitHub 不會再用 workflow_run 連鎖觸發部署，
      # 開盤前網站就停在前一晚的預測（11/25 當沖卡片還是沒看到美股大跌的版本），所以這裡直接觸發部署
      - name: 更新網站
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "已觸發部署"
