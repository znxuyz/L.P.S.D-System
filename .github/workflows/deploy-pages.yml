name: Deploy to GitHub Pages

# 網站部署：程式碼推到 main，或「Update market data」更新完資料之後。
# 這裡只讀 data 分支，不抓資料。
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Update market data', 'Morning forecast']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 資料存在獨立的 data 分支（由 update-data.yml 更新）
      - name: 取出 data 分支
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$DATA_REMOTE" .data
          else
            mkdir .data
          fi

      # 預測的事前存檔（forecasts 分支，update-data.yml 每天收盤後新增）：給預測頁打「實盤成績」
      - name: 取出預測存檔
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" forecasts >/dev/null; then
            git clone --depth 1 --branch forecasts "$DATA_REMOTE" .forecasts
          fi

      # 模擬盤用：每天全市場行情（排行榜、偽即時行情）與新聞，由 data 分支的資料產生，不另外存
      - name: 產生模擬盤資料
        run: |
          if [ -d .data/candles ]; then node scripts/sim-daily.ts .data && node scripts/sim-news.ts .data; fi
          # 模擬盤「分析」分頁：當時已公布的財報與本益比（每檔一個檔案）
          if [ -d .data/fin ] && [ -d .data/candles ]; then node scripts/sim-fund.ts .data; fi
          # 模擬盤「選股」分頁：每個交易日收盤後、用當時看得到的資料跑一次五大選股
          if [ -d .data/ratios ] && [ -d .data/candles ]; then node scripts/sim-screen.ts .data; fi
          # 「預測」頁：個股 20 日排名、大盤 20 日方向、00631L 當沖（逐段往前滾訓練，含樣本外回測）
          # （順便把 2022 年起逐段往前滾的「每天開盤前預測」寫進 .backfill，給模擬帳戶歷史回測用）
          if [ -d .data/candles ] && [ -f .data/index/TAIEX.json ]; then BACKFILL_DIR=.backfill BACKFILL_FROM=2021-12-01 FORECASTS_DIR=.forecasts node scripts/predict.ts .data; fi
          # 00631L 5 分 K 走勢預測（加權指數 5 分 K，資料不夠時輸出 ready: false）
          if [ -f .data/index/TAIEX.json ]; then FORECASTS_DIR=.forecasts node scripts/predict-intraday.ts .data; fi
          # 同一套模型的 3 分 K、1 分 K（加權指數每 5 秒資料切的；不存檔、不做區間進出場）
          if [ -f .data/index/TAIEX.json ]; then TF=3 node scripts/predict-intraday.ts .data; TF=1 node scripts/predict-intraday.ts .data; fi
          # 模型模擬帳戶：完全照事前存檔的預測自動下單（紙上交易）
          if [ -d .forecasts ]; then FORECASTS_DIR=.forecasts node scripts/paper-trade.ts .data; fi
          # 模擬帳戶歷史回測（2022 起；同一套規則，用逐段往前滾的預測）
          if [ -d .backfill ]; then FORECASTS_DIR=.backfill PAPER_FROM=2022-01-01 PAPER_OUT=paper-backtest.json node scripts/paper-trade.ts .data; fi
          # 沒有即時行情金鑰時首頁用的最近一個交易日收盤資料
          node scripts/close-snapshot.ts .data

      - name: 放進網站
        run: |
          mkdir -p web/public/data
          for f in active-etf.json stocks.json chips.json fundamentals.json pe5y.json pattern-stats.json close.json etf-info.json market-risk.json predict.json predict-intraday.json predict-analogs.json predict-intraday-3m.json predict-analogs-3m.json predict-intraday-1m.json predict-analogs-1m.json paper.json paper-backtest.json; do
            if [ -f ".data/$f" ]; then cp ".data/$f" web/public/data/; fi
          done
          if [ -d .data/candles ]; then cp -r .data/candles web/public/data/; fi
          if [ -d .data/chips ]; then cp -r .data/chips web/public/data/; fi
          if [ -f .data/index/TAIEX.json ]; then mkdir -p web/public/data/index && cp .data/index/TAIEX.json web/public/data/index/; fi
          if [ -d .data/exrights ]; then cp -r .data/exrights web/public/data/; fi
          for d in simday news simfund simscreen; do if [ -d ".data/$d" ]; then cp -r ".data/$d" web/public/data/; fi; done
          if [ -f .data/names.json ]; then cp .data/names.json web/public/data/; fi

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
