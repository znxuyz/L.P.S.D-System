name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 主動式 ETF 每天收盤後公告持股：台北時間 18:37 抓一次，22:07 再補抓一次（週一到週五）
    - cron: '37 10 * * 1-5'
    - cron: '7 14 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 每日資料存在獨立的 data 分支，不會弄亂 main 的紀錄
      - name: 取出 data 分支
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$DATA_REMOTE" .data
          else
            git init -b data .data
            git -C .data remote add origin "$DATA_REMOTE"
          fi

      - name: 抓主動式 ETF 持股
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/active-etf.ts .data

      - name: 存回 data 分支
        if: github.event_name != 'push'
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "Update active ETF holdings $(date -u +%F)"
            git push origin data
          fi

      - name: 放進網站
        run: |
          mkdir -p web/public/data
          if [ -f .data/active-etf.json ]; then cp .data/active-etf.json web/public/data/; fi

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
