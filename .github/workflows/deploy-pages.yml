name: Deploy to GitHub Pages

# 網站部署：程式碼推到 main，或「Update market data」更新完資料之後。
# 這裡只讀 data 分支，不抓資料。
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Update market data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 資料存在獨立的 data 分支（由 update-data.yml 更新）
      - name: 取出 data 分支
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$DATA_REMOTE" .data
          else
            mkdir .data
          fi

      # 模擬盤用：每天全市場行情（排行榜、偽即時行情）與新聞，由 data 分支的資料產生，不另外存
      - name: 產生模擬盤資料
        run: |
          if [ -d .data/candles ]; then node scripts/sim-daily.ts .data && node scripts/sim-news.ts .data; fi

      - name: 放進網站
        run: |
          mkdir -p web/public/data
          for f in active-etf.json stocks.json chips.json fundamentals.json pe5y.json pattern-stats.json; do
            if [ -f ".data/$f" ]; then cp ".data/$f" web/public/data/; fi
          done
          if [ -d .data/candles ]; then cp -r .data/candles web/public/data/; fi
          if [ -d .data/chips ]; then cp -r .data/chips web/public/data/; fi
          if [ -f .data/index/TAIEX.json ]; then mkdir -p web/public/data/index && cp .data/index/TAIEX.json web/public/data/index/; fi
          if [ -d .data/exrights ]; then cp -r .data/exrights web/public/data/; fi
          for d in simday news; do if [ -d ".data/$d" ]; then cp -r ".data/$d" web/public/data/; fi; done
          if [ -f .data/names.json ]; then cp .data/names.json web/public/data/; fi

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
