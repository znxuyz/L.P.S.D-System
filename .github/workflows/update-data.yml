name: Update market data

# 抓官方資料存進 data 分支；跑完會觸發「Deploy to GitHub Pages」把新資料放上網站。
# - 收盤後（台北 18:37、22:07）：每日資料（主動式 ETF、股票目錄、日 K、籌碼、財報、重大訊息）。
# - 每小時：回補 2025-01-01 以後的歷史資料，每次有額度上限，補完之後幾乎不會再發請求。
# - 抓資料的程式有改動時：馬上跑一次。
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'web/src/data/mopsParse.ts', '.github/workflows/update-data.yml']
  schedule:
    - cron: '37 10 * * 1-5'
    - cron: '7 14 * * 1-5'
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# data 分支一次只讓一個工作寫入
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      ARCHIVE_START: '2025-01-01'
      # 每小時的回補不用重抓每天只更新一次的資料
      HOURLY: ${{ github.event.schedule == '23 * * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 取出 data 分支
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$DATA_REMOTE" .data
          else
            git init -b data .data
            git -C .data remote add origin "$DATA_REMOTE"
          fi

      - name: 抓主動式 ETF 持股
        if: env.HOURLY != 'true'
        continue-on-error: true
        run: node scripts/active-etf.ts .data

      - name: 更新全市場股票目錄
        if: env.HOURLY != 'true'
        continue-on-error: true
        run: node scripts/stock-list.ts .data

      # 證交所、櫃買每日收盤行情累積成日 K（2025-01-01 起，每次最多回補 80 天）
      - name: 日 K
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/candles.ts .data

      # 回補歷史：5 年本益比、每日本益比、重大訊息、集保千張大戶（每次有額度上限）
      - name: 回補歷史資料
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/history.ts .data

      # 法人買賣超（2025-01-01 起）與千張大戶 4 週變化
      - name: 籌碼
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/chips.ts .data

      # 財報（每季，有快取並回補 2025 年起各季）、連續配息年數、特殊事件
      - name: 財報、股利與重大訊息
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/financials.ts .data

      # data 分支只留一個版本（舊版本沒有用，避免儲存庫越來越大）
      - name: 存回 data 分支
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -q -m "Market data $(date -u +'%F %H:%M')"
          git push -f origin snapshot:data
          du -sh --exclude=.git .
