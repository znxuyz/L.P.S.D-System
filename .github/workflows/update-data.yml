name: Update market data

# 抓官方資料存進 data 分支；跑完會觸發「Deploy to GitHub Pages」把新資料放上網站。
# - 收盤後（台北 18:37、22:07）：每日資料（主動式 ETF、ETF 淨值與規模、股票目錄、日 K、籌碼、財報、重大訊息）。
# - 每小時：回補 2020-01-01 以後的歷史資料（留作之後模擬交易回測用），每次跑 50 分鐘，補完之後幾乎不會再發請求。
# - 抓資料的程式有改動時：馬上跑一次。
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'web/src/data/mopsParse.ts', '.github/workflows/update-data.yml']
  schedule:
    - cron: '37 10 * * 1-5'
    - cron: '7 14 * * 1-5'
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 回補還沒完成時，自己觸發下一輪
  actions: write

# data 分支一次只讓一個工作寫入
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      ARCHIVE_START: '2020-01-01'
      # 每小時的回補（含自動接續的下一輪）不用重抓每天只更新一次的資料
      HOURLY: ${{ github.event.schedule == '23 * * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 取出 data 分支
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$DATA_REMOTE" .data
          else
            git init -b data .data
            git -C .data remote add origin "$DATA_REMOTE"
          fi

      # 三個網站各一組、同時進行（每組只對自己的網站發請求，間隔不變，不會加重單一網站的負擔）。
      # 每次最多跑 50 分鐘，時間到就停下來存檔，下一次從斷點繼續。
      - name: 抓資料（證交所／櫃買、公開資訊觀測站、集保 平行）
        timeout-minutes: 60
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          PRIVATE_DATA_REPO: ${{ vars.PRIVATE_DATA_REPO || format('{0}/lpsd-private-data', github.repository_owner) }}
          CANDLE_MAX_DATES: '1000'
          INST_MAX: '1000'
          RATIO_MAX: '1000'
          EVENT_MAX: '1000'
          FIN_MAX: '100'
          TDCC_MAX: '1000000'
          MARGIN_MAX: '400'
          INTRADAY_MAX: '300'
        run: |
          set +e
          START_S=$(date +%s)
          export DEADLINE=$(( START_S * 1000 + 50 * 60 * 1000 ))
          (
            if [ "$HOURLY" != true ]; then node scripts/active-etf.ts .data; node scripts/stock-list.ts .data; fi
            # 股票名稱（含已下市）：每季抽一天抓一次，抓過就不再抓
            if [ "$HOURLY" != true ] || [ ! -f .data/names.json ]; then node scripts/names.ts .data; fi
            node scripts/candles.ts .data
            node scripts/chips.ts .data
            # 上市融資維持率：每天一次請求，回補 2020 年以後
            PART=margin node scripts/market-risk.ts .data
            HISTORY_PARTS=pe,index,div,ratios node scripts/history.ts .data
            # ETF 淨值、規模、受益人數、配息與填息（用到上面的除權息與日 K）
            if [ "$HOURLY" != true ] || [ ! -f .data/etf-info.json ]; then node scripts/etf-info.ts .data; fi
            # 加權指數 5 分 K（每 5 秒指數統計）：每天一次請求，回補 2020 年以後（預測頁的 00631L 走勢預測）
            node scripts/intraday.ts .data
          ) > twse.log 2>&1 &
          (
            # 財報先跑：歷史事件回補很久，放前面會把時間用完，財報季報就一直補不到
            node scripts/financials.ts .data
            # 每月營收（2019 年起；第一手的獲利資料，個股模型用）
            node scripts/revenue.ts .data
            HISTORY_PARTS=events node scripts/history.ts .data
          ) > mops.log 2>&1 &
          ( HISTORY_PARTS=tdcc node scripts/history.ts .data ) > tdcc.log 2>&1 &
          # 美股（費城半導體、那斯達克、S&P 500、台積電 ADR、VIX）
          ( node scripts/us-market.ts .data ) > us.log 2>&1 &
          # 個股 1 分 K（富果，金鑰在 GitHub Secret FUGLE_API_KEY）：富果資料不能公開，只存進私人儲存庫
          # （PRIVATE_DATA_TOKEN 有設才做；儲存庫名稱預設 <擁有者>/lpsd-private-data，可用 repository variable PRIVATE_DATA_REPO 改）
          (
            if [ -n "$PRIVATE_DATA_TOKEN" ] && [ -n "$FUGLE_API_KEY" ]; then
              PRIV="https://x-access-token:${PRIVATE_DATA_TOKEN}@github.com/${PRIVATE_DATA_REPO}.git"
              if git clone -q --depth 1 "$PRIV" .private 2>/dev/null; then :; else
                git init -q -b main .private && git -C .private remote add origin "$PRIV"
              fi
              STOCK1M_OUT=.private node scripts/stock-intraday.ts .data
              ( cd .private && git add -A && if ! git diff --cached --quiet; then
                  git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "stock1m $(date -u +'%F %H:%M')" && git push -q origin HEAD:main && echo "已推送到私人儲存庫"
                fi )
            else
              echo "個股 1 分 K：沒有 PRIVATE_DATA_TOKEN 或 FUGLE_API_KEY，略過（富果資料只存私人儲存庫）"
            fi
          ) > fugle.log 2>&1 &
          # 期交所：外資台指期淨未平倉（每月一次請求）
          # 臺指期近月日 K（一般時段＋夜盤）也在這一組（同一個網站，依序請求）
          ( PART=futures node scripts/market-risk.ts .data; node scripts/taifex-daily.ts .data ) > taifex.log 2>&1 &
          wait
          # 大盤風險指標（融資維持率、外資期貨）：兩組都抓完再整理
          node scripts/market-risk.ts .data > risk.log 2>&1
          # 集保補完之後重算一次千張大戶變化（不發請求的部分很快）
          INST_MAX=0 HOURLY=true node scripts/chips.ts .data > chips2.log 2>&1
          # 事前存檔：收盤後把「下一個交易日」的預測存進 forecasts 分支（只新增、不覆蓋、不強制推送；
          # 程式只在收盤後到下一個交易日 08:45 前存，git 的提交時間可以證明是事前做的）
          if git ls-remote --exit-code --heads "$DATA_REMOTE" forecasts >/dev/null; then
            git clone -q --branch forecasts "$DATA_REMOTE" .forecasts
          else
            git init -q -b forecasts .forecasts && git -C .forecasts remote add origin "$DATA_REMOTE"
          fi
          ( ARCHIVE_DIR=.forecasts ARCHIVE_ONLY=1 node scripts/predict.ts .data; ARCHIVE_DIR=.forecasts ARCHIVE_ONLY=1 node scripts/predict-intraday.ts .data ) > archive.log 2>&1
          ( cd .forecasts && git add -A && if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Forecasts $(date -u +'%F %H:%M')" && git push -q origin HEAD:forecasts && echo "已推送存檔"
            fi ) >> archive.log 2>&1
          # 型態歷史勝率：用全市場日 K 回測（不發請求，約 3～5 分鐘）；每日更新時跑，或還沒有結果時跑
          if [ "$HOURLY" != true ] || [ ! -f .data/pattern-stats.json ]; then
            DEADLINE=$(( $(date +%s) * 1000 + 12 * 60 * 1000 )) node --import ./scripts/lib/ts-resolve.mjs scripts/pattern-stats.ts .data > stats.log 2>&1
          fi
          for f in twse mops tdcc taifex us fugle risk chips2 archive stats; do [ -f $f.log ] || continue; echo "::group::$f"; tail -n 80 $f.log; echo "::endgroup::"; done
          # 跑滿時間代表還有沒補完的資料
          if [ $(( $(date +%s) - START_S )) -ge $(( 45 * 60 )) ]; then echo "MORE=true" >> "$GITHUB_ENV"; fi

      # data 分支只留一個版本（舊版本沒有用，避免儲存庫越來越大）
      - name: 存回 data 分支
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -q -m "Market data $(date -u +'%F %H:%M')"
          git push -f origin snapshot:data
          du -sh --exclude=.git .

      # 每小時排程有時會延遲很久才開始；回補還沒完成就直接接著跑下一輪
      - name: 接著跑下一輪
        if: env.MORE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-data.yml --repo "${{ github.repository }}" --ref main
