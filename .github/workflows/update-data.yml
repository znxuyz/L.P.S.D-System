name: Update market data

# 抓官方資料存進 data 分支；跑完會觸發「Deploy to GitHub Pages」把新資料放上網站。
# - 收盤後（台北 18:37、22:07）：每日資料（主動式 ETF、股票目錄、日 K、籌碼、財報、重大訊息）。
# - 每小時：回補 2020-01-01 以後的歷史資料（留作之後模擬交易回測用），每次跑 50 分鐘，補完之後幾乎不會再發請求。
# - 抓資料的程式有改動時：馬上跑一次。
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'web/src/data/mopsParse.ts', '.github/workflows/update-data.yml']
  schedule:
    - cron: '37 10 * * 1-5'
    - cron: '7 14 * * 1-5'
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 回補還沒完成時，自己觸發下一輪
  actions: write

# data 分支一次只讓一個工作寫入
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      ARCHIVE_START: '2020-01-01'
      # 每小時的回補（含自動接續的下一輪）不用重抓每天只更新一次的資料
      HOURLY: ${{ github.event.schedule == '23 * * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 取出 data 分支
        run: |
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$DATA_REMOTE" .data
          else
            git init -b data .data
            git -C .data remote add origin "$DATA_REMOTE"
          fi

      # 三個網站各一組、同時進行（每組只對自己的網站發請求，間隔不變，不會加重單一網站的負擔）。
      # 每次最多跑 50 分鐘，時間到就停下來存檔，下一次從斷點繼續。
      - name: 抓資料（證交所／櫃買、公開資訊觀測站、集保 平行）
        timeout-minutes: 60
        env:
          CANDLE_MAX_DATES: '1000'
          INST_MAX: '1000'
          RATIO_MAX: '1000'
          EVENT_MAX: '1000'
          FIN_MAX: '100'
          TDCC_MAX: '1000000'
        run: |
          set +e
          START_S=$(date +%s)
          export DEADLINE=$(( START_S * 1000 + 50 * 60 * 1000 ))
          (
            if [ "$HOURLY" != true ]; then node scripts/active-etf.ts .data; node scripts/stock-list.ts .data; fi
            node scripts/candles.ts .data
            node scripts/chips.ts .data
            HISTORY_PARTS=pe,index,div,ratios node scripts/history.ts .data
          ) > twse.log 2>&1 &
          (
            # 財報先跑：歷史事件回補很久，放前面會把時間用完，財報季報就一直補不到
            node scripts/financials.ts .data
            HISTORY_PARTS=events node scripts/history.ts .data
          ) > mops.log 2>&1 &
          ( HISTORY_PARTS=tdcc node scripts/history.ts .data ) > tdcc.log 2>&1 &
          wait
          # 集保補完之後重算一次千張大戶變化（不發請求的部分很快）
          INST_MAX=0 HOURLY=true node scripts/chips.ts .data > chips2.log 2>&1
          # 型態歷史勝率：用全市場日 K 回測（不發請求，約 3～5 分鐘）；每日更新時跑，或還沒有結果時跑
          if [ "$HOURLY" != true ] || [ ! -f .data/pattern-stats.json ]; then
            DEADLINE=$(( $(date +%s) * 1000 + 8 * 60 * 1000 )) node --import ./scripts/lib/ts-resolve.mjs scripts/pattern-stats.ts .data > stats.log 2>&1
          fi
          for f in twse mops tdcc chips2 stats; do [ -f $f.log ] || continue; echo "::group::$f"; tail -n 80 $f.log; echo "::endgroup::"; done
          # 跑滿時間代表還有沒補完的資料
          if [ $(( $(date +%s) - START_S )) -ge $(( 45 * 60 )) ]; then echo "MORE=true" >> "$GITHUB_ENV"; fi

      # data 分支只留一個版本（舊版本沒有用，避免儲存庫越來越大）
      - name: 存回 data 分支
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -q -m "Market data $(date -u +'%F %H:%M')"
          git push -f origin snapshot:data
          du -sh --exclude=.git .

      # 每小時排程有時會延遲很久才開始；回補還沒完成就直接接著跑下一輪
      - name: 接著跑下一輪
        if: env.MORE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-data.yml --repo "${{ github.repository }}" --ref main
