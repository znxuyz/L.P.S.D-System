<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>L.P.L.C. 資金指揮台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
    />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <pattern id="br-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" class="br-hatch-line"></line>
        </pattern>
        <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#00e5ff" stop-opacity="0"></stop>
          <stop offset="0.85" stop-color="#00e5ff" stop-opacity="0.10"></stop>
          <stop offset="1" stop-color="#00e5ff" stop-opacity="0.45"></stop>
        </linearGradient>
        <radialGradient id="sweep-grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"></stop>
          <stop offset="1" stop-color="#00e5ff" stop-opacity="0"></stop>
        </radialGradient>
        <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur>
          <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
        </filter>
      </defs>
    </svg>
    <div class="app">
      <header class="topbar hud">
        <div class="brand">
          <svg class="crest" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 2 29 9.5v13L16 30 3 22.5v-13Z" class="crest-hex"></path>
            <circle cx="16" cy="16" r="5.5" class="crest-core"></circle>
            <path d="M16 6v4M16 22v4M6 16h4M22 16h4" class="crest-tick"></path>
          </svg>
          <div class="brand-text">
            <p class="hud-code">L.P.L.C. // TACTICAL COMMAND</p>
            <h1>資金指揮台</h1>
          </div>
          <span class="chip-mock" title="目前使用模擬行情，數字不代表實際市場">SIM 模擬行情</span>
        </div>
        <dl class="ticker" id="ticker"></dl>
        <div class="controls">
          <div class="seg" role="group" aria-label="播放速度">
            <button type="button" id="speed-1" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" id="speed-10" data-speed="10" aria-pressed="false">10×</button>
            <button type="button" id="speed-60" data-speed="60" aria-pressed="true">60×</button>
          </div>
          <button type="button" class="btn" id="btn-play">暫停</button>
          <button type="button" class="btn" id="btn-restart">重播</button>
          <button type="button" class="btn" id="btn-convention" title="切換漲跌配色">紅漲綠跌</button>
        </div>
      </header>

      <nav class="sectors hud" id="sectors" aria-label="產業"></nav>

      <main class="field hud">
        <div class="field-head">
          <div class="tabs" role="tablist" aria-label="視圖">
            <button type="button" role="tab" id="tab-breath" data-view="breath" aria-selected="true" aria-controls="breath">
              <span class="hud-code">FLUX</span>資金呼吸圖
            </button>
            <button type="button" role="tab" id="tab-gravity" data-view="gravity" aria-selected="false" aria-controls="gravity">
              <span class="hud-code">RADAR</span>資金雷達
            </button>
          </div>
          <p class="field-hint" id="field-hint"></p>
        </div>
        <div class="view" id="breath" role="tabpanel" aria-labelledby="tab-breath"></div>
        <div class="view" id="gravity" role="tabpanel" aria-labelledby="tab-gravity" hidden></div>
      </main>

      <aside class="side">
        <div class="detail hud" id="detail" aria-live="polite"></div>
        <section class="log hud" aria-labelledby="log-title">
          <h2 class="panel-title" id="log-title"><span class="hud-code">MISSION LOG</span>作戰日誌</h2>
          <ol class="log-list" id="log"></ol>
        </section>
      </aside>

      <section class="dock" id="dock" aria-label="盤中統計"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
