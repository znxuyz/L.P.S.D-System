<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>L.P.L.C. 資金熱力圖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
    />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="app page-map">
      <header class="topbar glass">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8ff0ff"></stop>
                <stop offset="1" stop-color="#8b7bff"></stop>
              </linearGradient>
            </defs>
            <circle cx="16" cy="16" r="13" fill="none" stroke="url(#logo-g)" stroke-width="1.6" opacity="0.55"></circle>
            <path d="M9 22V10M9 22h14" fill="none" stroke="url(#logo-g)" stroke-width="2.4" stroke-linecap="round"></path>
            <circle cx="21" cy="12" r="3" fill="url(#logo-g)"></circle>
          </svg>
          <div class="brand-text">
            <b>L.P.L.C.</b>
            <span>資金熱力圖</span>
          </div>
          <button type="button" class="chip-source is-mock" id="source-chip" title="目前使用模擬行情，數字不代表實際市場">模擬行情</button>
        </div>
        <div class="pages" role="tablist" aria-label="頁面">
          <button type="button" role="tab" id="tab-map" data-page="map" aria-selected="true" aria-controls="page-map">熱力圖</button>
          <button type="button" role="tab" id="tab-intel" data-page="intel" aria-selected="false">市場情報</button>
          <button type="button" role="tab" id="tab-screen" data-page="screen" aria-selected="false">五大選股</button>
          <button type="button" role="tab" id="tab-etf" data-page="etf" aria-selected="false">ETF</button>
        </div>
        <dl class="ticker" id="ticker"></dl>
        <details class="menu">
          <summary class="icon-btn" aria-label="設定">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </summary>
          <div class="menu-body glass">
            <p class="menu-label">資料來源</p>
            <div class="seg seg-2" role="group" aria-label="資料來源">
              <button type="button" data-source="mock" aria-pressed="true">模擬行情</button>
              <button type="button" data-source="fugle" aria-pressed="false">富果真實</button>
            </div>
            <form class="key-form" id="fugle-form">
              <label class="menu-note" for="fugle-key">富果 API 金鑰</label>
              <input id="fugle-key" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 API 金鑰" />
              <div class="menu-row">
                <button type="submit" class="btn btn-accent">儲存並連線</button>
                <button type="button" class="btn" id="fugle-clear">清除</button>
              </div>
              <p class="menu-note">金鑰只存在這台裝置的瀏覽器，不會上傳。</p>
            </form>
            <p class="menu-status" id="source-status" hidden></p>
            <div class="playback" id="playback">
              <p class="menu-label">播放速度</p>
              <div class="seg" role="group" aria-label="播放速度">
                <button type="button" id="speed-1" data-speed="1" aria-pressed="false">1×</button>
                <button type="button" id="speed-10" data-speed="10" aria-pressed="false">10×</button>
                <button type="button" id="speed-60" data-speed="60" aria-pressed="true">60×</button>
              </div>
              <p class="menu-label">行情</p>
              <div class="menu-row">
                <button type="button" class="btn" id="btn-play">暫停</button>
                <button type="button" class="btn" id="btn-restart">重播</button>
              </div>
            </div>
            <p class="menu-label">漲跌配色</p>
            <button type="button" class="btn" id="btn-convention" title="切換漲跌配色">紅漲綠跌</button>
          </div>
        </details>
      </header>

      <nav class="sectors glass" id="sectors" aria-label="產業"></nav>

      <main class="field glass" id="page-map" role="tabpanel" aria-labelledby="tab-map">
        <div class="field-head">
          <h2 class="panel-title">市場熱力圖</h2>
          <ul class="hint-chips" aria-label="讀圖方式">
            <li>面積 = 今日成交額</li>
            <li>顏色 = 漲跌幅</li>
            <li><i class="dot-glow"></i>發光 = 吸金最強</li>
            <li><i class="dot-drain"></i>變淡 = 資金撤出</li>
          </ul>
          <button type="button" class="filter-chip" id="filter-chip" hidden></button>
        </div>
        <div class="view" id="map"></div>
        <aside class="map-detail glass" id="map-detail" aria-live="polite" hidden></aside>
        <div class="toasts" id="toasts" aria-live="polite"></div>
      </main>

      <aside class="side">
        <div class="detail glass" id="detail" aria-live="polite"></div>
        <section class="log glass" aria-labelledby="log-title">
          <h2 class="panel-title" id="log-title">盤中事件</h2>
          <ol class="log-list" id="log"></ol>
        </section>
      </aside>

      <section class="dock" id="dock" aria-label="盤中統計"></section>

      <section class="screener" id="page-screen" aria-label="五大核心選股">
        <nav class="strategies glass" id="strategies"></nav>
        <div class="scr-main glass" id="screen"></div>
        <aside class="scr-detail glass" id="screen-detail" aria-live="polite"></aside>
      </section>

      <section class="screener etf-page" id="page-etf" aria-label="ETF">
        <nav class="strategies glass" id="etf-cats"></nav>
        <div class="scr-main glass" id="etf-list"></div>
        <aside class="scr-detail glass" id="etf-detail" aria-live="polite"></aside>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
