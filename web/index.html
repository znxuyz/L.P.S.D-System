<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>台股大冒險</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar win">
        <div class="brand">
          <img class="crest" id="crest" alt="" width="32" height="32" />
          <div class="brand-text">
            <h1>台股大冒險</h1>
            <p class="eyebrow">L.P.L.C. Laplace Predictive Leading Core</p>
          </div>
          <span class="chip-mock" title="目前使用模擬行情，數字不代表實際市場">模擬行情</span>
        </div>
        <dl class="ticker" id="ticker"></dl>
        <div class="controls">
          <div class="seg" role="group" aria-label="播放速度">
            <button type="button" id="speed-1" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" id="speed-10" data-speed="10" aria-pressed="false">10×</button>
            <button type="button" id="speed-60" data-speed="60" aria-pressed="true">60×</button>
          </div>
          <button type="button" class="btn" id="btn-play">暫停</button>
          <button type="button" class="btn" id="btn-restart">重播</button>
          <button type="button" class="btn" id="btn-convention" title="切換漲跌配色">紅漲綠跌</button>
        </div>
      </header>

      <nav class="sectors win" id="sectors" aria-label="王國一覽"></nav>

      <main class="field win">
        <div class="field-head">
          <h2 class="panel-title">世界地圖</h2>
          <p class="field-hint" id="field-hint"></p>
          <button type="button" class="btn btn-expand" id="btn-expand" aria-pressed="false" title="放大地圖（F）">放大地圖</button>
        </div>
        <div class="view" id="map"></div>
        <div class="dialogue" id="dialogue" role="status" aria-live="polite"></div>
      </main>

      <aside class="side">
        <div class="detail win" id="detail" aria-live="polite"></div>
        <section class="log win" aria-labelledby="log-title">
          <h2 class="panel-title" id="log-title">冒險日誌</h2>
          <ol class="log-list" id="log"></ol>
        </section>
      </aside>

      <section class="dock" id="dock" aria-label="盤中統計"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
