<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>L.P.L.C. 資金熱力圖</title>
    <meta name="theme-color" content="#060914" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="L.P.L.C." />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
    />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="app page-map">
      <header class="topbar glass">
        <div class="brand">
          <button type="button" class="logo-btn" id="logo-btn" title="拉普拉斯模擬盤：用歷史行情練習交易" aria-label="進入拉普拉斯模擬盤">
            <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8ff0ff"></stop>
                  <stop offset="1" stop-color="#8b7bff"></stop>
                </linearGradient>
                <radialGradient id="logo-iris" cx="50%" cy="50%" r="50%">
                  <stop offset="0" stop-color="#e9fdff"></stop>
                  <stop offset="0.45" stop-color="#8ff0ff"></stop>
                  <stop offset="1" stop-color="#6a5cff"></stop>
                </radialGradient>
              </defs>
              <g class="logo-ring">
                <circle cx="32" cy="32" r="28" fill="none" stroke="url(#logo-g)" stroke-width="2" opacity="0.6"></circle>
                <path d="M32 2.5v4M32 57.5v4M2.5 32h4M57.5 32h4M11.1 11.1l2.8 2.8M50.1 50.1l2.8 2.8M11.1 52.9l2.8-2.8M50.1 13.9l2.8-2.8" stroke="url(#logo-g)" stroke-width="2.2" stroke-linecap="round"></path>
              </g>
              <g class="logo-orbit">
                <circle cx="32" cy="32" r="20.5" fill="none" stroke="url(#logo-g)" stroke-width="1.4" stroke-dasharray="2 4" opacity="0.75"></circle>
                <circle cx="50" cy="23" r="2.4" fill="#8ff0ff"></circle>
              </g>
              <path d="M10 32 Q32 14 54 32 Q32 50 10 32 Z" fill="#0b1030" stroke="url(#logo-g)" stroke-width="2.6" stroke-linejoin="round"></path>
              <circle cx="32" cy="32" r="9.5" fill="url(#logo-iris)"></circle>
              <ellipse class="logo-pupil" cx="32" cy="32" rx="2.4" ry="7.6" fill="#060914"></ellipse>
              <circle cx="35.4" cy="28" r="1.9" fill="#fff" opacity="0.9"></circle>
            </svg>
          </button>
          <div class="brand-text">
            <b>L.P.L.C.</b>
            <span class="brand-main">資金熱力圖</span>
            <span class="brand-sim">LAPLACE 模擬盤</span>
          </div>
          <button type="button" class="chip-source is-mock" id="source-chip" title="目前使用模擬行情，數字不代表實際市場">模擬行情</button>
        </div>
        <div class="pages" role="tablist" aria-label="頁面">
          <button type="button" role="tab" id="tab-map" data-page="map" aria-selected="true" aria-controls="page-map">熱力圖</button>
          <button type="button" role="tab" id="tab-intel" data-page="intel" aria-selected="false">市場情報</button>
          <button type="button" role="tab" id="tab-screen" data-page="screen" aria-selected="false">五大選股</button>
          <button type="button" role="tab" id="tab-etf" data-page="etf" aria-selected="false">ETF</button>
          <button type="button" role="tab" id="tab-stock" data-page="stock" aria-selected="false">個股分析</button>
        </div>
        <div class="sim-bar">
          <button type="button" class="btn btn-sm" id="sim-who" hidden title="回到大廳"></button>
          <button type="button" class="btn btn-sm" id="sim-exit" title="離開模擬盤">離開</button>
        </div>
        <dl class="ticker" id="ticker"></dl>
        <details class="menu">
          <summary class="icon-btn" aria-label="設定">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </summary>
          <div class="menu-body glass">
            <p class="menu-label">資料來源</p>
            <div class="seg" role="group" aria-label="資料來源">
              <button type="button" data-source="mock" aria-pressed="true">模擬</button>
              <button type="button" data-source="fugle" aria-pressed="false">富果</button>
              <button type="button" data-source="twse" aria-pressed="false">證交所</button>
            </div>
            <form class="key-form" id="source-form" hidden>
              <div class="field-proxy">
                <label class="menu-note" for="mis-proxy">證交所轉接網址（Cloudflare Worker）</label>
                <input id="mis-proxy" type="url" autocomplete="off" spellcheck="false" placeholder="https://xxx.workers.dev" />
              </div>
              <label class="menu-note" for="fugle-key" id="fugle-key-label">富果 API 金鑰</label>
              <input id="fugle-key" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 API 金鑰" />
              <div class="menu-row">
                <button type="submit" class="btn btn-accent">儲存並連線</button>
                <button type="button" class="btn" id="source-clear">清除</button>
              </div>
              <p class="menu-note">設定只存在這台裝置的瀏覽器，不會上傳。</p>
            </form>
            <p class="menu-status" id="source-status" hidden></p>
            <div class="playback" id="playback">
              <p class="menu-label">播放速度</p>
              <div class="seg" role="group" aria-label="播放速度">
                <button type="button" id="speed-1" data-speed="1" aria-pressed="false">1×</button>
                <button type="button" id="speed-10" data-speed="10" aria-pressed="false">10×</button>
                <button type="button" id="speed-60" data-speed="60" aria-pressed="true">60×</button>
              </div>
              <p class="menu-label">行情</p>
              <div class="menu-row">
                <button type="button" class="btn" id="btn-play">暫停</button>
                <button type="button" class="btn" id="btn-restart">重播</button>
              </div>
            </div>
            <p class="menu-label">漲跌配色</p>
            <button type="button" class="btn" id="btn-convention" title="切換漲跌配色">紅漲綠跌</button>
          </div>
        </details>
      </header>

      <nav class="sectors glass" id="sectors" aria-label="產業"></nav>

      <main class="field glass" id="page-map" role="tabpanel" aria-labelledby="tab-map">
        <div class="field-head">
          <h2 class="panel-title">市場熱力圖</h2>
          <ul class="hint-chips" aria-label="讀圖方式">
            <li>面積 = 今日成交額</li>
            <li>顏色 = 漲跌幅</li>
            <li><i class="dot-glow"></i>發光 = 吸金最強</li>
            <li><i class="dot-drain"></i>變淡 = 資金撤出</li>
          </ul>
          <button type="button" class="filter-chip" id="filter-chip" hidden></button>
        </div>
        <div class="view" id="map-view"></div>
        <aside class="map-detail glass" id="map-detail" aria-live="polite" hidden></aside>
        <div class="toasts" id="toasts" aria-live="polite"></div>
      </main>

      <aside class="side">
        <div class="detail glass" id="detail" aria-live="polite"></div>
        <section class="log glass" aria-labelledby="log-title">
          <h2 class="panel-title" id="log-title">盤中事件</h2>
          <ol class="log-list" id="log"></ol>
        </section>
      </aside>

      <section class="dock" id="dock" aria-label="盤中統計"></section>

      <section class="screener" id="page-screen" aria-label="五大核心選股">
        <nav class="strategies glass" id="strategies"></nav>
        <div class="scr-main glass" id="screen-main"></div>
        <aside class="scr-detail glass" id="screen-detail" aria-live="polite"></aside>
      </section>

      <section class="analysis" id="page-stock" aria-label="個股分析"></section>

      <section class="sim" id="page-sim" aria-label="拉普拉斯模擬盤"></section>

      <section class="screener etf-page" id="page-etf" aria-label="ETF">
        <nav class="strategies glass" id="etf-cats"></nav>
        <div class="scr-main glass" id="etf-list"></div>
        <aside class="scr-detail glass" id="etf-detail" aria-live="polite"></aside>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
