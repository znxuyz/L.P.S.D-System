<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>L.P.L.C. 資金熱力圖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap"
    />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <pattern id="br-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" class="br-hatch-line"></line>
        </pattern>
      </defs>
    </svg>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="crest" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="3" y="3" width="15" height="15" rx="1.5"></rect>
            <rect x="20" y="3" width="9" height="9" rx="1.5" class="crest-dim"></rect>
            <rect x="20" y="14" width="9" height="15" rx="1.5" class="crest-dim"></rect>
            <rect x="3" y="20" width="15" height="9" rx="1.5" class="crest-ghost"></rect>
          </svg>
          <div class="brand-text">
            <h1>資金熱力圖</h1>
            <p class="eyebrow">L.P.L.C. · Laplace Predictive Leading Core</p>
          </div>
          <span class="chip-mock" title="目前使用模擬行情，數字不代表實際市場">模擬行情</span>
        </div>
        <dl class="ticker" id="ticker"></dl>
        <div class="controls">
          <div class="seg" role="group" aria-label="播放速度">
            <button type="button" id="speed-1" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" id="speed-10" data-speed="10" aria-pressed="false">10×</button>
            <button type="button" id="speed-60" data-speed="60" aria-pressed="true">60×</button>
          </div>
          <button type="button" class="btn" id="btn-play">暫停</button>
          <button type="button" class="btn" id="btn-restart">重播</button>
          <button type="button" class="btn" id="btn-convention" title="切換漲跌配色">紅漲綠跌</button>
        </div>
      </header>

      <nav class="sectors" id="sectors" aria-label="產業"></nav>

      <main class="field">
        <div class="field-head">
          <div class="tabs" role="tablist" aria-label="視圖">
            <button type="button" role="tab" id="tab-breath" data-view="breath" aria-selected="true" aria-controls="breath">資金呼吸圖</button>
            <button type="button" role="tab" id="tab-gravity" data-view="gravity" aria-selected="false" aria-controls="gravity">資金引力場</button>
          </div>
          <p class="field-hint" id="field-hint"></p>
        </div>
        <div class="view" id="breath" role="tabpanel" aria-labelledby="tab-breath"></div>
        <div class="view" id="gravity" role="tabpanel" aria-labelledby="tab-gravity" hidden></div>
      </main>

      <aside class="detail" id="detail" aria-live="polite"></aside>

      <section class="dock" id="dock" aria-label="盤中統計"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
