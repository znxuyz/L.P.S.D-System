<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>資金熱力圖提案</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap"
    />
  </head>
  <body>
    <div class="cmp">
      <header class="topbar">
        <div class="brand">
          <div class="brand-text">
            <h1>資金熱力圖提案</h1>
            <p class="eyebrow">L.P.L.C. · Laplace Predictive Leading Core</p>
          </div>
          <span class="chip-mock" title="目前使用模擬行情，數字不代表實際市場">模擬行情</span>
        </div>
        <dl class="ticker" id="ticker"></dl>
        <div class="controls">
          <div class="seg" role="group" aria-label="播放速度">
            <button type="button" id="speed-1" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" id="speed-10" data-speed="10" aria-pressed="false">10×</button>
            <button type="button" id="speed-60" data-speed="60" aria-pressed="true">60×</button>
          </div>
          <button type="button" class="btn" id="btn-play">暫停</button>
          <button type="button" class="btn" id="btn-restart">重播</button>
          <button type="button" class="btn" id="btn-convention" title="切換漲跌配色">紅漲綠跌</button>
        </div>
      </header>

      <main class="cmp-grid">
        <section class="cmp-card" aria-labelledby="t-breath">
          <div class="cmp-head">
            <h2 id="t-breath"><span class="cmp-no">①</span>資金呼吸圖</h2>
            <p>面積 = 今日成交額，虛線框 = 20 日平均規模。方塊撐破虛線框代表資金湧入，縮在斜線空地裡代表資金撤出。</p>
            <div class="cmp-legend" aria-hidden="true">
              <span><svg viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" class="lg-fill up"></rect><rect x="5" y="4" width="12" height="8" class="lg-ghost"></rect></svg>資金湧入</span>
              <span><svg viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" class="lg-slot"></rect><rect x="6" y="4.5" width="10" height="7" class="lg-fill down"></rect><rect x="1" y="1" width="20" height="14" class="lg-ghost"></rect></svg>資金撤出</span>
            </div>
          </div>
          <div class="cmp-stage" id="breath"></div>
          <div class="cmp-rotation">
            <h3><span class="cmp-no">②</span>資金輪動條碼 <small>每格 5 分鐘・顏色 = 成交佔比偏離常態的程度</small></h3>
            <div id="rotation"></div>
          </div>
        </section>

        <section class="cmp-card" aria-labelledby="t-gravity">
          <div class="cmp-head">
            <h2 id="t-gravity"><span class="cmp-no">③</span>資金引力場</h2>
            <p>泡泡大小 = 今日成交額，同產業聚在同一個方位。資金流入的股票被吸向中央的資金核心，流出的被推到外圈。</p>
          </div>
          <div class="cmp-stage" id="gravity"></div>
        </section>
      </main>

      <footer class="cmp-pick" id="pick" aria-live="polite"></footer>
    </div>
    <script type="module" src="/src/compare.ts"></script>
  </body>
</html>
