    <path d="M32 4.5v3M32 56.5v3M4.5 32h3M56.5 32h3M12.6 12.6l2.1 2.1M49.3 49.3l2.1 2.1M12.6 51.4l2.1-2.1M49.3 14.7l2.1-2.1"/>
